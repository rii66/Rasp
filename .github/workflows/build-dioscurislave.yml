name: Build DioscuriSlave UF2 (RP2040)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "DioscuriSlave/**"
      - ".github/workflows/build-dioscurislave.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install RP2040 core and libraries
        run: |
          arduino-cli config init
          arduino-cli core update-index --additional-urls https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
          arduino-cli core install rp2040:rp2040 --additional-urls https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
          arduino-cli lib update-index
          arduino-cli lib install U8g2

      - name: Compile for Raspberry Pi Pico
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build/DioscuriSlave"
          arduino-cli compile \
            --fqbn rp2040:rp2040:rpipico \
            --warnings all \
            --export-binaries \
            --output-dir "$GITHUB_WORKSPACE/build/DioscuriSlave" \
            "$GITHUB_WORKSPACE/DioscuriSlave"

      - name: Verify UF2 output
        run: |
          UF2="$GITHUB_WORKSPACE/build/DioscuriSlave/DioscuriSlave.ino.uf2"
          test -s "$UF2" || { echo "::error::UF2 file missing or empty"; exit 1; }
          ls -lh "$UF2"
          file "$UF2"

      - name: Upload UF2 firmware
        uses: actions/upload-artifact@v4
        with:
          name: DioscuriSlave-Pico-UF2
          path: build/DioscuriSlave/DioscuriSlave.ino.uf2
          if-no-files-found: error
          retention-days: 30
